name: Publish images

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      OCI_REGISTRY: ghcr.io
      OCI_REPOSITORY: ghcr.io/${{ github.repository_owner }}
      HELM_OCI_REPOSITORY: ghcr.io/reviewsignal/charts

    # Add "id-token" with the intended permissions.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Package Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - run: make git-semver
      - run: make github-env >> $GITHUB_ENV

      - name: Setup Project
        run: |
          npm ci
          make generate manifests chart

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.OCI_REPOSITORY }}/orderly-ape
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=${{ env.IMAGE_RELEASE_TRACK_TAG }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            ${{ steps.meta.outputs.annotations }}
          build-args: |
            TAG=${{ env.IMAGE_TAG }}
            REPOSITORY=${{ env.REPOSITORY }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            GIT_TREE_STATE=${{ env.GIT_TREE_STATE }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}
            VERSION=${{ env.VERSION }}

      - name: Package and push Helm chart
        run: |
          mkdir -p _work/charts
          cp -a ./charts/orderly-ape ./_work/charts/orderly-ape
          sed -i 's/version: "0.2.0"/version: "${{ env.IMAGE_TAG }}"/g' ./_work/charts/orderly-ape/Chart.yaml
          sed -i 's/appVersion: "0.2.0"/appVersion: "${{ env.IMAGE_TAG }}"/g' ./_work/charts/orderly-ape/Chart.yaml
          helm registry login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ghcr.io
          helm package ./_work/charts/orderly-ape -d ./_work/charts
          helm push ./_work/charts/*.tgz oci://${{ env.HELM_OCI_REPOSITORY }}

