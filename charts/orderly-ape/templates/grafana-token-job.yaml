{{- if .Values.grafana.enabled }}
---
# Job to create Grafana service account token
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "orderly-ape.fullname" . }}-grafana-token
  labels:
    {{- include "orderly-ape.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ include "orderly-ape.fullname" . }}-grafana-token
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "orderly-ape.serviceAccountName" . }}
      containers:
      - name: create-token
        image: bitpoke/toolbox:alpine-3.22.2
        env:
        - name: GRAFANA_URL
          value: {{ include "orderly-ape.grafanaURL" . | quote }}
        - name: GRAFANA_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "grafana.fullname" .Subcharts.grafana }}
              key: admin-user
        - name: GRAFANA_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "grafana.fullname" .Subcharts.grafana }}
              key: admin-password
        - name: GRAFANA_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "orderly-ape.fullname" . }}-grafana-token
              key: admin-token
              optional: true
        - name: KUBERNETES_API
          value: "https://$(KUBERNETES_SERVICE_HOST):$(KUBERNETES_SERVICE_PORT)"
        - name: SECRET_NAME
          value: {{ include "orderly-ape.fullname" . }}-grafana-token
        - name: SECRET_NAMESPACE
          value: {{ .Release.Namespace }}
        - name: SECRET_LABELS
          value: {{ include "orderly-ape.labels" . | fromYaml | toJson | quote }}
        command:
        - /bin/bash
        - -c
        - {{ .Files.Get "files/grafana-token.sh" | quote }}
{{- end }}
