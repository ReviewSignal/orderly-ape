global:
  imagePullSecrets: []
  leaderElection:
    # Override the namespace used for the leader election lease.
    namespace: "orderly-ape"
    # leaseDuration: 60s
    # renewDeadline: 40s
    # retryPeriod: 15s

# Default values for orderly-ape.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/reviewsignal/orderly-ape
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Specifies whether RBAC resources should be created
  create: true

# JWT configuration for token generation and validation
jwt:
  # If not set, defaults to the first ingress host, else "ape.local"ape.lo
  issuer: ""
  # RSA key for signing and verifying JWTs, in PEM format. If not set, a key will be generated.
  rsaPrivateKey: ""
  # Public key for verifying JWTs (optional). If not set, derived from rsaPrivateKey.
  rsaPublicKey: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  fsGroup: 65532

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Additional environment variables to set
env: []

# Additional environment variables to set from additional sources
envFrom: []

# Creates a secret with the following content and mounts it in the pod at /run/secrets/
secret: {}

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: "ape.reviewsignal.com"
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

issuer:
  # Specifies whether a cert-manager ACME Issuer should be created
  create: true
  # Annotations to add to the issuer
  annotations: {}
  # The name of the issuer to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # The ACME server to use.
  server: https://acme-v02.api.letsencrypt.org/directory

## --- Chart Dependencies --- ##
cert-manager:
  enabled: false

ingress-nginx:
  enabled: false
  controller:
    replicaCount: 1
    service:
      type: LoadBalancer
    resources: {}
      # limits:
      #   cpu: 100m
      #   memory: 128Mi
      # requests:
      #   cpu: 100m
      #   memory: 128Mi
    ingressClass: "ape.reviewsignal.com"
    ingressClassResource:
      default: false
      name: "ape.reviewsignal.com"
    admissionWebhooks:
      certManager:
        enabled: true

dex:
  enabled: false
  grpc:
    enabled: true
  config:
    issuer: '{{ getenv "DEX_ISSUER" "http://127.0.0.1:5556/dex" }}'
    frontend:
      issuer: 'Orderly Ape'
    storage:
      type: kubernetes
      config:
        inCluster: true
    oauth2:
      skipApprovalScreen: true
    grpc:
      reflection: true
    enablePasswordDB: true
    staticClients:
      - id: '{{ getenv "ORDERLY_APE_OIDC_CLIENT_ID" "orderly-ape" }}'
        secret: '{{ getenv "ORDERLY_APE_OIDC_CLIENT_SECRET" "orderly-ape-not-so-secret-client" }}'
        name: "Orderly Ape"
        redirectURIs:
        - '{{ getenv "ORDERLY_APE_OIDC_REDIRECT_URL" "http://localhost:7331/auth/callback" }}'

# Admin user configuration for Dex
# If not set, the email defaults to admin@<ingress-host> and password is auto-generated
adminEmail: ""
adminPassword: ""

grafana:
  enabled: true
  # Grafana service configuration
  deploymentStrategy:
    type: Recreate
  service:
    type: ClusterIP
    port: 80
  # Datasources configuration - InfluxDB will be automatically added by Orderly Ape
  datasources: {}
  # Dashboard providers - Dashboards are generated by Orderly Ape
  dashboardProviders: {}
  # Dashboards - Dashboards are generated by Orderly Ape
  dashboards: {}
  # Auth proxy configuration for Orderly Ape integration
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
      hide_version: true
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
  plugins:
    - https://github.com/VictoriaMetrics/victorialogs-datasource/releases/download/v0.21.2/victoriametrics-logs-datasource-v0.21.2.zip;victorialogs-datasource
  persistence:
    enabled: true
    size: 10Gi

influxdb:
  enabled: false
  image:
    tag: 2.7.12
  adminUser:
    organization: orderly-ape
    bucket: default
  persistence:
    enabled: true
    size: 10Gi
  ingress:
    enabled: true
    annotations:
      cert-manager.io/issuer: "orderly-ape"
    className: "ape.reviewsignal.com"
    tls: true
    secretName: orderly-ape-influxdb-tls

victorialogs:
  enabled: false
  server:
    ingress:
      ingressClassName: "ape.reviewsignal.com"
      annotations:
        cert-manager.io/issuer: "orderly-ape"
    persistentVolume:
      enabled: true
      size: 10Gi

# Local worker configuration for running k6 tests in the cluster
localWorker:
  # Specifies whether a local worker should be created
  enabled: true
  # The namespace where the local worker will run k6 test jobs
  namespace: "orderly-ape-k6"
  # Name of the worker resource
  name: "local"
  # NodeSelector to specify the nodes where the worker pods should be scheduled
  nodeSelector: {}
  # Tolerations to specify the tolerations for the worker pods
  tolerations: []
